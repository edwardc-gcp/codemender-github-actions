name: 'CodeMender Autonomous Remediation (Private Repo)'

on:
  schedule:
    # Nightly execution at 03:00 UTC for automated vulnerability resolution
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      finding_id:
        description: 'Specific Finding ID or prefix to fix (leave blank to remediate all CRITICAL/HIGH findings)'
        required: false
        type: string

concurrency:
  group: codemender-remediation-private-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autonomous-remediation:
    name: Synthesize Patches & Open Remediation PR (Private Repo)
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      pull-requests: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # Full Git history (fetch-depth: 0) is required for cm vcs status and PR diff generation
          fetch-depth: 0

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure ADC Credentials Outside Git Workspace
        run: |
          mkdir -p "$HOME/.config/gcloud"
          cp "${GOOGLE_APPLICATION_CREDENTIALS}" "$HOME/.config/gcloud/application_default_credentials.json"
          # Immediately purge temporary credential file from Git workspace to prevent accidental commit
          rm -f "${GOOGLE_APPLICATION_CREDENTIALS}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/.config/gcloud/application_default_credentials.json" >> $GITHUB_ENV
          mkdir -p .git/info
          printf '%s\n' .cm_project 'gha-creds-*.json' >> .git/info/exclude

      - name: Add local bin to PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache CodeMender CLI Binary
        id: cache-cm
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/cm
          key: cm-binary-${{ runner.os }}-v0.10.0

      - name: Download & Install CodeMender CLI
        if: steps.cache-cm.outputs.cache-hit != 'true'
        run: |
          curl -L -o /tmp/cm-linux-amd64.zip "https://artifactregistry.googleapis.com/download/v1/projects/cmoc-prod/locations/us/repositories/codemender-cli-production/files/cm:stable:cm-linux-amd64.zip:download?alt=media"
          unzip -q -o /tmp/cm-linux-amd64.zip -d /tmp/cm-dist
          chmod +x /tmp/cm-dist/cm
          mv /tmp/cm-dist/cm "$HOME/.local/bin/cm"
          "$HOME/.local/bin/cm" --version

      - name: Cache CodeMender Findings & State Database
        id: cache-cm-state
        uses: actions/cache@v4
        with:
          path: |
            .codemender/
            ~/.codemender/state.db
          key: cm-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            cm-state-${{ runner.os }}-${{ github.ref_name }}-

      - name: Download Findings Artifact (if available)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: codemender-findings
          path: /tmp/codemender-artifact

      - name: Initialize & Verify CodeMender Workspace
        run: |
          cm init
          cm init --verify

      - name: Execute Autonomous Patch Remediation (Cache-First)
        run: |
          mkdir -p /tmp/codemender-evidence

          # 0. Import findings artifact if present
          if [ -f /tmp/codemender-artifact/codemender-findings.json ]; then
            echo "📥 Importing findings from workflow artifact (codemender-findings.json)..."
            cm report import -f /tmp/codemender-artifact/codemender-findings.json || true
          fi

          SPECIFIC_TARGET="${{ github.event.inputs.finding_id }}"
          if [ -n "$SPECIFIC_TARGET" ]; then
            echo "🎯 Targeted Remediation: Evaluating Finding ID ${SPECIFIC_TARGET}..."
            if ! cm report -f json 2>/dev/null | jq -e ".[] | select((.finding_id == \"${SPECIFIC_TARGET}\") or (.id == \"${SPECIFIC_TARGET}\") or ((.finding_id // \"\") | startswith(\"${SPECIFIC_TARGET}\")))" >/dev/null 2>&1; then
              echo "⚠️ Target finding ${SPECIFIC_TARGET} not found in restored cache/artifact. Running fallback discovery scan..."
              cm find . --fail-on="CRITICAL,HIGH" --sandbox=false --yes --bypass-warning
            else
              echo "⚡ Target finding ${SPECIFIC_TARGET} verified in restored cache/artifact."
            fi

            echo "🔬 Generating exploit PoC & verification evidence for Finding: ${SPECIFIC_TARGET}..."
            cm verify "${SPECIFIC_TARGET}" --no-reset --sandbox=false --yes --bypass-warning < /dev/null || true

            echo "Applying autonomous patch for Finding: ${SPECIFIC_TARGET}"
            cm fix "${SPECIFIC_TARGET}" --sandbox=false --yes --bypass-warning < /dev/null
          else
            echo "🔍 Batch Remediation Mode: Querying open CRITICAL and HIGH findings from CodeMender cache..."
            FINDING_IDS=$(cm report -f json 2>/dev/null | jq -r '.[] | select((.status == "OPEN" or .status == "REOPENED" or .status == null) and (.severity == "CRITICAL" or .severity == "HIGH")) | (.finding_id // .id)' 2>/dev/null || echo "")

            if [ -z "$FINDING_IDS" ]; then
              echo "ℹ️ No prior Critical/High findings found in cache/artifact. Running fallback discovery scan..."
              cm find . --fail-on="CRITICAL,HIGH" --sandbox=false --yes --bypass-warning
              FINDING_IDS=$(cm report -f json 2>/dev/null | jq -r '.[] | select((.status == "OPEN" or .status == "REOPENED" or .status == null) and (.severity == "CRITICAL" or .severity == "HIGH")) | (.finding_id // .id)' 2>/dev/null || echo "")
            else
              COUNT=$(echo "$FINDING_IDS" | wc -w | tr -d ' ')
              echo "⚡ Restored ${COUNT} actionable CRITICAL/HIGH findings from cache/artifact."
            fi

            if [ -z "$FINDING_IDS" ]; then
              echo "No open Critical or High findings discovered to remediate."
            else
              for FID in $FINDING_IDS; do
                echo "=============================================="
                echo "  Verifying & Synthesizing PoC for: ${FID}"
                echo "=============================================="
                cm verify "${FID}" --no-reset --sandbox=false --yes --bypass-warning < /dev/null || true
                echo "=============================================="
                echo "  Applying autonomous patch for Finding: ${FID}"
                echo "=============================================="
                cm fix "${FID}" --sandbox=false --yes --bypass-warning < /dev/null || true
              done
            fi
          fi

          # Extract all verification artifacts from any subdirectories to /tmp/codemender-evidence outside workspace
          echo "📦 Harvesting CodeMender verification artifacts across workspace..."
          find . -type d -name ".exploit" | while read -r edir; do
            echo "Found verification evidence in $edir, backing up to /tmp/codemender-evidence..."
            cp -r "$edir"/* /tmp/codemender-evidence/ 2>/dev/null || true
          done
          find . -type f \( -name "PLAN.md" -o -name "LOG.md" -o -name "exploit.sh" -o -name "REPORT.md" -o -name "poc.*" \) | while read -r efile; do
            cp "$efile" /tmp/codemender-evidence/ 2>/dev/null || true
          done

      - name: Clean Verification Artifacts & Inspect Working Directory Changes
        id: git_status
        run: |
          # 1. Restore any tracked project .gitignore files in case they were modified
          git checkout HEAD -- '**/.gitignore' 2>/dev/null || true

          # 2. Purge internal CodeMender runtime tracking files and untracked .gitignore
          find . -name ".cm_project" -delete 2>/dev/null || true
          find . -name ".cm_*" -delete 2>/dev/null || true
          find . -name ".gitignore" -exec grep -lE "(\.cm_project|PLAN\.md|\.exploit)" {} + 2>/dev/null | xargs rm -f 2>/dev/null || true

          # 3. Purge all .exploit directories and verification files from working tree!
          # DO NOT commit exploit scripts, logs, or plans to the production repository!
          find . -type d -name ".exploit" -prune -exec rm -rf {} + 2>/dev/null || true
          find . -type f \( -name "PLAN.md" -o -name "LOG.md" -o -name "exploit.sh" -o -name "REPORT.md" -o -name "poc.*" \) -delete 2>/dev/null || true
          rm -rf codemender-evidence 2>/dev/null || true

          echo "=== CodeMender VCS Status ==="
          cm vcs status
          echo "=== CodeMender Generated Patches ==="
          cm report --patches || true

          # 4. Detect code modifications (strictly production code changes)
          if [ -n "$(git diff --name-only)" ] || [ -n "$(git status --porcelain -- ':!.codemender')" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Modified source files detected. Preparing automated Pull Request."
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No source code modifications required."
          fi

      - name: Prepare Private Repository Pull Request Metadata
        if: steps.git_status.outputs.has_changes == 'true'
        id: pr_meta
        run: |
          TARGET_ID="${{ github.event.inputs.finding_id }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          RUN_URL="${REPO_URL}/actions/runs/${{ github.run_id }}"

          python3 - << 'PYEOF'
          import json, os, subprocess

          target_id = os.environ.get("TARGET_ID", "").strip()
          repo_url = os.environ.get("REPO_URL", "")
          run_url = os.environ.get("RUN_URL", "")

          findings = []
          try:
              raw = subprocess.check_output(["cm", "report", "-f", "json"], stderr=subprocess.DEVNULL)
              findings = json.loads(raw)
          except Exception:
              findings = []

          pr_title = "🛡️ [CodeMender] Autonomous Security Remediation"
          summary_rows = []

          if target_id:
              matched = [f for f in findings if f.get("finding_id","").startswith(target_id) or f.get("id","").startswith(target_id)]
              if matched:
                  f = matched[0]
                  fid = f.get("finding_id", f.get("id", target_id))
                  title = f.get("title", f.get("headline", target_id))
                  sev = f.get("severity", "SECURITY").upper()
                  pr_title = f"🛡️ [CodeMender] Fix: {title} ({sev})"
                  cat = f.get("vuln_id") or f.get("category") or f.get("cwe") or "CWE-Security"
                  file_path = f.get("file_path") or f.get("location", {}).get("path", "Unknown")
                  start_line = f.get("start_line") or f.get("location", {}).get("start_line", "")
                  loc_str = f"`{file_path}:{start_line}`" if start_line else f"`{file_path}`"
                  summary_rows.append(f"| `{fid[:8]}` | **{sev}** | `{cat}` | {title} | {loc_str} |")
              else:
                  pr_title = f"🛡️ [CodeMender] Fix Finding: {target_id}"
                  summary_rows.append(f"| `{target_id}` | *High/Critical* | `Security` | Targeted Remediation | *Modified in Diff* |")
          else:
              remediated_count = 0
              for f in findings:
                  sev = f.get("severity", "").upper()
                  if sev in ("CRITICAL", "HIGH"):
                      fid = f.get("finding_id", f.get("id", "Unknown"))
                      title = f.get("title", f.get("headline", "Security Vulnerability"))
                      cat = f.get("vuln_id") or f.get("category") or f.get("cwe") or "CWE-Security"
                      file_path = f.get("file_path") or f.get("location", {}).get("path", "Unknown")
                      start_line = f.get("start_line") or f.get("location", {}).get("start_line", "")
                      loc_str = f"`{file_path}:{start_line}`" if start_line else f"`{file_path}`"
                      summary_rows.append(f"| `{fid[:8]}` | **{sev}** | `{cat}` | {title} | {loc_str} |")
                      remediated_count += 1
              if remediated_count > 0:
                  pr_title = f"🛡️ [CodeMender] Remediate {remediated_count} Critical & High Vulnerabilities"
              else:
                  pr_title = "🛡️ [CodeMender] Batch Security Remediation"

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"pr_title={pr_title}\n")

          # Write body to /tmp/pr_body.md so it never pollutes the git working tree
          with open("/tmp/pr_body.md", "w") as out:
              out.write("## 🛡️ CodeMender Autonomous Security Remediation (Private Repo)\n\n")
              out.write("This automated Pull Request was generated by **CodeMender** on the **Gemini Enterprise Agent Platform**.\n\n")
              out.write("### 🔒 Internal Security Review Evidence & Findings Breakdown\n\n")
              out.write("| Finding ID | Severity | Category | Vulnerability Headline | Location |\n")
              out.write("| :--- | :--- | :--- | :--- | :--- |\n")
              if summary_rows:
                  for row in summary_rows:
                      out.write(f"{row}\n")
              else:
                  out.write("| N/A | *Security* | *CWE* | Contextual Code Patch | *See Diff* |\n")
              out.write("\n")

              out.write("### 📑 CodeMender Verification Evidence & Root Cause Analysis\n\n")
              out.write("> 💡 **Repository Hygiene Notice**: Verification artifacts (`PLAN.md`, `REPORT.md`, `exploit.sh`, `LOG.md`) are embedded below for engineering review and archived in workflow artifacts, but are **excluded from Git commits** to prevent polluting the production codebase.\n\n")

              evidence_dir = "/tmp/codemender-evidence"
              plan_file = os.path.join(evidence_dir, "PLAN.md")
              report_file = os.path.join(evidence_dir, "REPORT.md")
              exploit_file = None
              for cand in ["exploit.sh", "poc.js", "poc.py", "poc.sh"]:
                  p = os.path.join(evidence_dir, cand)
                  if os.path.isfile(p):
                      exploit_file = p
                      break

              evidence_rendered = False

              if os.path.isfile(report_file):
                  try:
                      with open(report_file, "r") as rf:
                          report_content = rf.read().strip()
                      if report_content:
                          out.write("<details open>\n")
                          out.write("<summary>📊 <b>REPORT.md: Root Cause Analysis & Proof of Exploit</b></summary>\n\n")
                          out.write(f"{report_content}\n\n")
                          out.write("</details>\n\n")
                          evidence_rendered = True
                  except Exception:
                      pass

              if os.path.isfile(plan_file):
                  try:
                      with open(plan_file, "r") as pf:
                          plan_content = pf.read().strip()
                      if plan_content:
                          out.write("<details open>\n")
                          out.write("<summary>📋 <b>PLAN.md: Attack & Remediation Strategy</b></summary>\n\n")
                          out.write(f"{plan_content}\n\n")
                          out.write("</details>\n\n")
                          evidence_rendered = True
                  except Exception:
                      pass

              if exploit_file and os.path.isfile(exploit_file):
                  try:
                      with open(exploit_file, "r") as ef:
                          exploit_content = ef.read().strip()
                      if exploit_content:
                          out.write("<details>\n")
                          out.write(f"<summary>⚡ <b>{os.path.basename(exploit_file)}: Sandbox Reproduction PoC Script</b></summary>\n\n")
                          out.write("```bash\n")
                          out.write(f"{exploit_content}\n")
                          out.write("```\n\n")
                          out.write("</details>\n\n")
                          evidence_rendered = True
                  except Exception:
                      pass

              if not evidence_rendered:
                  out.write("* 📋 **`PLAN.md`**: Target sink analysis, AST taint trace, and remediation plan.\n")
                  out.write("* ⚡ **`exploit.sh`**: Sandbox reproduction PoC script verifying exploitability.\n")
                  out.write("* 📊 **`REPORT.md`**: Root Cause Analysis and before/after verification report.\n")
                  out.write("* 🔬 **`LOG.md`**: Detailed sandbox execution trace and verification logs.\n\n")

              out.write("### 🔍 Verification Checklist\n")
              out.write("- [x] Code conforms to project language standards\n")
              out.write("- [x] Internal CodeMender runtime metadata and exploit scripts excluded from Git commit\n")
              out.write("- [ ] Automated CI branch tests passing\n")
              out.write("- [ ] Internal peer code review & security engineer sign-off\n\n")
              out.write(f"📦 *Raw artifacts are also downloadable from the [GitHub Actions Run]({run_url}).*\n\n")
              out.write("---\n*Generated by CodeMender AI Security Co-developer in GitHub Actions.*\n")
          PYEOF
        env:
          TARGET_ID: ${{ github.event.inputs.finding_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Archive CodeMender Evidence Artifacts
        if: steps.git_status.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codemender-verification-evidence
          path: /tmp/codemender-evidence/
          retention-days: 14

      - name: Create Automated Remediation Pull Request
        if: steps.git_status.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'fix(security): autonomous remediation patches synthesized by CodeMender'
          branch: codemender/auto-remediation-${{ github.run_id }}
          delete-branch: true
          title: ${{ steps.pr_meta.outputs.pr_title }}
          body-path: /tmp/pr_body.md
          labels: |
            security
            automated-pr
            codemender
            internal-review
