name: CodeMender Security Scan & SARIF Export

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run a full scheduled security audit every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      deep_scan:
        description: 'Run exhaustive concurrent file-by-file Deep Scan instead of rapid Quick Scan (--quick)'
        required: false
        default: false
        type: boolean

# Cancel in-progress runs for the same branch to optimize runner costs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codemender-security-audit:
    name: Autonomous Code Vulnerability Scan
    # Fork and Dependabot PR workflows cannot read repository secrets for Google Cloud WIF
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write         # Workload Identity Federation
      security-events: write  # Upload SARIF to GitHub Code Scanning
      actions: read           # Required to upload SARIF from private repositories

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # Full history is required for PR diff resolution (cm find --diff)
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure ADC Credentials Outside Git Workspace
        env:
          SA_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          mkdir -p "$HOME/.config/gcloud"
          cp "${GOOGLE_APPLICATION_CREDENTIALS}" "$HOME/.config/gcloud/application_default_credentials.json"
          # Immediately purge temporary credential file from Git workspace to prevent accidental commit
          rm -f "${GOOGLE_APPLICATION_CREDENTIALS}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/.config/gcloud/application_default_credentials.json" >> "$GITHUB_ENV"
          # Derive target project ID from Service Account email so cm health & scans resolve it explicitly
          DERIVED_PROJECT=$(printf '%s' "$SA_EMAIL" | sed -n 's/.*@\([^.]*\)\.iam\.gserviceaccount\.com/\1/p')
          if [ -n "$DERIVED_PROJECT" ]; then
            echo "GOOGLE_CLOUD_PROJECT=$DERIVED_PROJECT" >> "$GITHUB_ENV"
          fi
          mkdir -p .git/info
          printf '%s\n' .cm_project .exploit/ 'gha-creds-*.json' 'cm-support-bundle-*.tar.gz' >> .git/info/exclude

      - name: Add local bin to PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache CodeMender CLI Binary
        id: cache-cm
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/cm
          key: cm-binary-${{ runner.os }}-v0.17.0

      - name: Download & Install CodeMender CLI
        if: steps.cache-cm.outputs.cache-hit != 'true'
        run: |
          echo "Downloading stable CodeMender CLI binary..."
          curl -fsSL -o /tmp/cm-linux-amd64.zip "https://artifactregistry.googleapis.com/download/v1/projects/cmoc-prod/locations/us/repositories/codemender-cli-production/files/cm:stable:cm-linux-amd64.zip:download?alt=media"
          unzip -q -o /tmp/cm-linux-amd64.zip -d /tmp/cm-dist
          chmod +x /tmp/cm-dist/cm
          mv /tmp/cm-dist/cm "$HOME/.local/bin/cm"
          "$HOME/.local/bin/cm" --version

      - name: Cache CodeMender Findings & State Database
        id: cache-cm-state
        uses: actions/cache@v4
        with:
          path: |
            .codemender/
            ~/.codemender/state.db
          key: cm-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            cm-state-${{ runner.os }}-${{ github.ref_name }}-

      - name: Initialize Workspace & Run Preflight Health Check
        run: |
          cm init
          cm health --strict

      - name: Execute Autonomous Security Scan
        id: scan
        run: |
          status=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "🔍 Pull Request detected: Running differential AST scan against origin/${{ github.base_ref }} (with 1-hop impact analysis)..."
            cm find . \
              --diff="origin/${{ github.base_ref }}" \
              --diff-workers=16 \
              --fail-on="CRITICAL,HIGH" \
              --sandbox=false \
              --yes \
              --bypass-warning || status=$?
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.deep_scan }}" = "true" ]; then
            echo "🔬 Scheduled or On-Demand Deep Scan: Running exhaustive concurrent file-by-file audit..."
            cm find . \
              --deep-workers=8 \
              --sandbox=false \
              --yes \
              --bypass-warning || status=$?
          else
            echo "🛡️ Push or Quick Audit detected: Running rapid single-session repository scan (--quick)..."
            cm find . \
              --quick \
              --sandbox=false \
              --yes \
              --bypass-warning || status=$?
          fi

          # Dedicated exit codes (10/20/30/40/60) indicate setup, auth, reachability, or capacity errors rather than completed scans.
          if [ "$status" -eq 0 ] || [ "$status" -eq 1 ]; then
            echo "completed=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Scan aborted with setup/service exit code ${status}; skipping SARIF export to preserve existing alerts."
            echo "completed=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Export Security Reports & Publish Job Summary
        if: ${{ !cancelled() && steps.scan.outputs.completed == 'true' }}
        run: |
          if ! command -v cm >/dev/null 2>&1 || [ ! -f "$HOME/.codemender/state.db" ]; then
            echo "⚠️ Skipping report export because the CodeMender workspace state was not initialized."
            exit 0
          fi

          echo "Exporting structured CodeMender findings in JSON format..."
          cm report -f json > results.json

          # Export actionable findings (filtering out resolved, dismissed, and [LEGACY / UNTOUCHED] technical debt)
          mkdir -p "$RUNNER_TEMP/codemender"
          jq '[.[] | select(.status != "RESOLVED" and .status != "FIXED" and .status != "DISMISSED" and ((.title // "") | contains("[LEGACY / UNTOUCHED]") | not))]' results.json > "$RUNNER_TEMP/codemender/codemender-findings.json" 2>/dev/null || cp results.json "$RUNNER_TEMP/codemender/codemender-findings.json"

          echo "Exporting native OASIS SARIF v2.1.0 report for GitHub Code Scanning..."
          cm report -f sarif > results.sarif

          echo "Publishing native Markdown summary to GitHub Actions Step Summary..."
          echo "## 🛡️ CodeMender Security Scan Summary" >> "$GITHUB_STEP_SUMMARY"
          cm report -f md >> "$GITHUB_STEP_SUMMARY" || true

          echo "SARIF Report generated successfully. Previewing findings:"
          head -n 25 results.sarif

      - name: Upload Findings Artifact for Autonomous Remediation
        if: ${{ !cancelled() && hashFiles('results.sarif') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: codemender-findings
          path: ${{ runner.temp }}/codemender/codemender-findings.json
          retention-days: 7

      - name: Upload SARIF Report to GitHub Code Scanning
        if: ${{ !cancelled() && hashFiles('results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: codemender-autonomous-scanner
