name: CodeMender Security Scan & SARIF Export

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run a full scheduled deep security audit every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      deep_scan:
        description: 'Enable CodeMender Deep Scan (--deep: scans all supported non-doc, non-config files)'
        required: false
        default: false
        type: boolean

# Cancel in-progress runs for the same branch to optimize runner costs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codemender-security-audit:
    name: Autonomous Code Vulnerability Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      security-events: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # Full history is required for PR diff resolution (cm find --diff)
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure ADC Credentials Outside Git Workspace
        run: |
          mkdir -p "$HOME/.config/gcloud"
          cp "${GOOGLE_APPLICATION_CREDENTIALS}" "$HOME/.config/gcloud/application_default_credentials.json"
          # Immediately purge temporary credential file from Git workspace to prevent accidental commit
          rm -f "${GOOGLE_APPLICATION_CREDENTIALS}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/.config/gcloud/application_default_credentials.json" >> $GITHUB_ENV

      - name: Add local bin to PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache CodeMender CLI Binary
        id: cache-cm
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/cm
          key: cm-binary-${{ runner.os }}-v0.10.0

      - name: Download & Install CodeMender CLI
        if: steps.cache-cm.outputs.cache-hit != 'true'
        run: |
          echo "Downloading stable CodeMender CLI binary..."
          curl -L -o /tmp/cm-linux-amd64.zip "https://artifactregistry.googleapis.com/download/v1/projects/cmoc-prod/locations/us/repositories/codemender-cli-production/files/cm:stable:cm-linux-amd64.zip:download?alt=media"
          unzip -q -o /tmp/cm-linux-amd64.zip -d /tmp/cm-dist
          chmod +x /tmp/cm-dist/cm
          mv /tmp/cm-dist/cm "$HOME/.local/bin/cm"
          "$HOME/.local/bin/cm" --version

      - name: Cache CodeMender Findings & State Database
        id: cache-cm-state
        uses: actions/cache@v4
        with:
          path: |
            .codemender/
            ~/.codemender/state.db
          key: cm-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            cm-state-${{ runner.os }}-${{ github.ref_name }}-

      - name: Initialize & Verify CodeMender Workspace
        run: |
          cm init
          cm init --verify

      - name: Execute Autonomous Security Scan
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.deep_scan }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "🔬 Deep scan mode enabled (--deep): scanning all supported non-doc, non-config files..."
            EXTRA_FLAGS="--deep"
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "🔍 Pull Request detected: Running differential AST scan against origin/${{ github.base_ref }} (with 1-hop impact analysis)..."
            cm find --diff="origin/${{ github.base_ref }}" -y --unrestricted --model gemini-3.8-flash --fail-on="CRITICAL,HIGH" ${EXTRA_FLAGS}
          else
            echo "🛡️ Push or Scheduled Audit detected: Running codebase security scan..."
            cm find . -y --unrestricted --model gemini-3.8-flash --fail-on="CRITICAL,HIGH" ${EXTRA_FLAGS}
          fi

      - name: Export Security Reports & Publish Job Summary
        if: always()
        run: |
          echo "Exporting structured CodeMender findings in JSON format..."
          cm report -f json > results.json

          # WORKAROUND: Generate GitHub-optimized SARIF v2.1.0 from structured JSON
          # In CodeMender Pre-GA / Public Preview, native SARIF export (cm report -f sarif) omits rule
          # definitions, CWE tags, and CVSS security-severity scores, causing GitHub to render generic
          # "Error" badges and display full analysis paragraphs as alert headlines.
          # This generator converts rich JSON findings into 100% GitHub Code Scanning compliant SARIF
          # until native upstream GitHub SARIF formatting lands in a future CodeMender release.
          python3 - << 'EOF'
          import json, os, re, sys

          repo_root = os.getcwd()
          json_path = 'results.json'
          sarif_path = 'results.sarif'

          findings = []
          if os.path.exists(json_path):
              try:
                  with open(json_path, 'r', encoding='utf-8') as f:
                      content = f.read().strip()
                      if content:
                          data = json.loads(content)
                          findings = data if isinstance(data, list) else []
              except Exception as e:
                  print(f"Warning: Failed to parse JSON report ({e}), creating empty SARIF.", file=sys.stderr)

          # Deterministic mapping to GitHub Code Scanning CVSS security-severity (0.0 - 10.0)
          SEV_MAP = {
              'CRITICAL': ('9.8', 'error'),
              'HIGH':     ('8.5', 'error'),
              'MEDIUM':   ('5.5', 'warning'),
              'LOW':      ('2.5', 'note'),
          }

          rules_dict = {}
          results = []

          for item in findings:
              if not isinstance(item, dict):
                  continue
              # Filter for active, actionable findings
              if item.get('status') not in ('OPEN', 'REOPENED', None):
                  continue

              title = item.get('title', 'Security Vulnerability').strip()
              sev = str(item.get('severity', 'HIGH')).upper()
              cvss_score, sarif_level = SEV_MAP.get(sev, ('8.5', 'error'))

              vuln_id = item.get('vuln_id') or 'CWE-Other'
              title_slug = re.sub(r'[^a-zA-Z0-9]+', '-', title.lower()).strip('-')[:50]
              rule_id = f"cm/{vuln_id.lower()}-{title_slug}"

              analysis = item.get('analysis', title)
              snippet = item.get('snippet', '').strip()

              if rule_id not in rules_dict:
                  tags = ['security']
                  if vuln_id.upper().startswith('CWE-'):
                      tags.append(f"external/cwe/{vuln_id.lower()}")

                  help_md = f"### {title}\n\n{analysis}"
                  if snippet:
                      help_md += f"\n\n```typescript\n{snippet}\n```"

                  rules_dict[rule_id] = {
                      'id': rule_id,
                      'name': title,
                      'shortDescription': {'text': title},
                      'fullDescription': {'text': analysis},
                      'help': {
                          'text': f"{analysis}\n\n{snippet}" if snippet else analysis,
                          'markdown': help_md
                      },
                      'properties': {
                          'security-severity': cvss_score,
                          'tags': tags
                      }
                  }

              # Convert runner filesystem path to repository-relative path
              raw_path = str(item.get('file_path', '')).replace('\\', '/')
              if os.path.isabs(raw_path):
                  try:
                      rel_path = os.path.relpath(raw_path, repo_root)
                  except ValueError:
                      rel_path = os.path.basename(raw_path)
              else:
                  rel_path = raw_path

              rel_path = rel_path.lstrip('./')
              if rel_path.startswith('../'):
                  rel_path = os.path.basename(rel_path)

              try:
                  start_line = max(1, int(item.get('start_line', 1)))
              except (ValueError, TypeError):
                  start_line = 1

              try:
                  end_line = max(start_line, int(item.get('end_line', start_line)))
              except (ValueError, TypeError):
                  end_line = start_line

              finding_id = item.get('finding_id') or item.get('id', '')
              res_obj = {
                  'ruleId': rule_id,
                  'level': sarif_level,
                  'message': {'text': f"{title}: {analysis}"},
                  'locations': [{
                      'physicalLocation': {
                          'artifactLocation': {
                              'uri': rel_path,
                              'uriBaseId': '%SRCROOT%'
                          },
                          'region': {
                              'startLine': start_line,
                              'endLine': end_line
                          }
                      }
                  }],
                  'properties': {
                      'finding_id': finding_id
                  }
              }
              if finding_id:
                  res_obj['correlationGuid'] = finding_id
              results.append(res_obj)

          sarif = {
              '$schema': 'https://json.schemastore.org/sarif-2.1.0.json',
              'version': '2.1.0',
              'runs': [{
                  'tool': {
                      'driver': {
                          'name': 'CodeMender',
                          'semanticVersion': '0.10.0',
                          'informationUri': 'https://cloud.google.com/security',
                          'rules': list(rules_dict.values())
                      }
                  },
                  'results': results
              }]
          }

          with open(sarif_path, 'w', encoding='utf-8') as f:
              json.dump(sarif, f, indent=2)

          print(f"Successfully generated GitHub-optimized SARIF ({len(results)} alerts across {len(rules_dict)} rules).")
          EOF
          
          echo "Publishing native Markdown summary to GitHub Actions Step Summary..."
          echo "## 🛡️ CodeMender Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          cm report -f md >> $GITHUB_STEP_SUMMARY || true

          echo "SARIF Report generated successfully. Previewing findings:"
          head -n 25 results.sarif

      - name: Upload SARIF Report to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: codemender-autonomous-scanner
